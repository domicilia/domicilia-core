name: ci

# Calidad + verificación de que la imagen de producción compila. NO despliega: eso
# es deploy.yml (staging, en cada merge a main) y promote.yml (producción, a mano).
# deploy.yml reutiliza este workflow como su etapa de calidad (workflow_call).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Lo reutiliza deploy.yml como su etapa de calidad.
  workflow_call:

# github.workflow en el grupo: cuando deploy.yml reutiliza este workflow (workflow_call),
# github.workflow es "deploy-staging", no "ci". Así la ejecución independiente y la que corre
# dentro del despliegue quedan en grupos distintos y una ya no cancela a la otra (antes los PR
# mostraban esos checks cancelados como fallidos).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Cachea módulos Y la compilación: golangci-lint (directiva `tool`)
          # tarda ~7 min en compilarse la primera vez y segundos después.
          cache: true

      - name: go.mod ordenado
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: sqlc (el código generado debe estar al día)
        run: |
          go tool sqlc generate
          git diff --exit-code internal/store

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: go tool golangci-lint run

      # Las pruebas de contrato usan un Postgres real (testcontainers); el runner
      # trae Docker. TESTS_DB_REQUIRED=1 hace que la ausencia de Docker FALLE en
      # vez de omitir las pruebas en silencio.
      - name: Pruebas (con detector de carreras, contra Postgres real)
        env:
          TESTS_DB_REQUIRED: "1"
        run: go test -race -cover ./...

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # el historial completo: un secreto borrado después sigue en él

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Versión fijada. No se usa gitleaks-action: exige licencia en repos de
      # organización. La ruta del módulo sigue siendo la antigua (zricethezav).
      - name: gitleaks (historial completo)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --no-banner --redact --verbose

  image:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build de Dockerfile.prod (sin publicar)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
