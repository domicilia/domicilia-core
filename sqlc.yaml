version: "2"
sql:
  - engine: postgresql
    # El stub de auth.users va primero: las migraciones lo referencian por FK.
    schema:
      - db/sqlc/auth_stub.sql
      - db/migrations
    queries: db/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: NullUUID
          - db_type: pg_catalog.timestamp
            go_type: time.Time
          - db_type: timestamptz
            go_type: time.Time
